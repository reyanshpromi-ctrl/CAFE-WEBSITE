</head>
<body>

    <script type="text/babel">
        const { useState } = React;

        const menuItems = [
            { id: 1, name: "Filter Coffee", price: 40, category: "Coffee", image: "☕", description: "Authentic South Indian brew" },
            { id: 2, name: "Cold Coffee", price: 90, category: "Coffee", image: "🧋", description: "Creamy with chocolate drizzle" },
            { id: 3, name: "Masala Chai", price: 30, category: "Tea", image: "🍵", description: "Ginger & Cardamom infused" },
            { id: 4, name: "Paneer Tikka Sandwich", price: 120, category: "Food", image: "🥪", description: "Grilled with mint chutney" },
            { id: 5, name: "Vada Pav (2 pcs)", price: 55, category: "Food", image: "🍔", description: "Classic Mumbai street food" },
            { id: 6, name: "Samosa Platter", price: 45, category: "Food", image: "🥟", description: "Crispy with tangy chutney" },
            { id: 7, name: "Maggi Masala", price: 60, category: "Food", image: "🍜", description: "Vegetable loaded comfort" },
            { id: 8, name: "Cheese Garlic Bread", price: 110, category: "Food", image: "🍞", description: "Buttery and overloaded" },
            { id: 9, name: "Chocolate Brownie", price: 85, category: "Dessert", image: "🍰", description: "Eggless gooey chocolate" }
        ];

        const App = () => {
            const [currentTab, setCurrentTab] = useState('home');
            const [cart, setCart] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [orderType, setOrderType] = useState('delivery');
            const [customerName, setCustomerName] = useState('');

            const addToCart = (item) => {
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    setCart(cart.map(c => c.id === item.id ? { ...c, quantity: c.quantity + 1 } : c));
                } else {
                    setCart([...cart, { ...item, quantity: 1 }]);
                }
            };

            const getTotal = () => {
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                return orderType === 'delivery' ? subtotal + 25 : subtotal;
            };

            const filteredMenu = selectedCategory === 'all' 
                ? menuItems 
                : menuItems.filter(item => item.category === selectedCategory);

            const placeWhatsAppOrder = () => {
                if (cart.length === 0) return alert('Add items to cart first! ☕');
                const orderText = `*New Order from CafeHub*%0A%0A*Name:* ${customerName || 'Guest'}%0A*Type:* ${orderType.toUpperCase()}%0A%0A*Items:*%0A${cart.map(item => `• ${item.quantity} x ${item.name} (₹${item.price})`).join('%0A')}%0A%0A*Total Amount:* ₹${getTotal()}%0A%0APlease confirm my order! ☕`;
                window.open(`https://wa.me/918805984678?text=${orderText}`, '_blank');
            };

            return (
                <div className="min-h-screen bg-orange-50/30">
                    <header className="bg-white/80 backdrop-blur-lg sticky top-0 z-50 border-b border-orange-100 shadow-sm">
                        <nav className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentTab('home')}>
                                <span className="text-3xl">☕</span>
                                <h1 className="text-2xl font-extrabold text-orange-950 tracking-tight">CafeHub</h1>
                            </div>
                            <div className="flex bg-gray-100 p-1 rounded-xl">
                                {['home', 'menu', 'cart'].map(tab => (
                                    <button 
                                        key={tab}
                                        onClick={() => setCurrentTab(tab)}
                                        className={`px-4 py-2 rounded-lg text-xs font-black transition-all ${currentTab === tab ? 'bg-orange-600 text-white shadow-md' : 'text-gray-500'}`}
                                    >
                                        {tab.toUpperCase()}
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {currentTab === 'home' && (
                            <div className="py-12 text-center">
                                <h2 className="text-6xl font-black text-gray-900 mb-6 leading-tight">
                                    Taste India's <br/> <span className="text-orange-600 underline">Favorite Snacks</span>
                                </h2>
                                <p className="text-xl text-gray-600 mb-10 max-w-xl mx-auto">Freshly brewed coffee and hot snacks delivered to your door starting at just ₹30.</p>
                                <button onClick={() => setCurrentTab('menu')} className="bg-orange-600 text-white px-12 py-5 rounded-full font-black text-xl shadow-2xl hover:scale-105 transition-transform">
                                    Browse Menu 🍕
                                </button>
                                <div className="mt-16 grid grid-cols-2 md:grid-cols-4 gap-4 opacity-75">
                                    <div className="p-4 bg-white rounded-2xl border border-orange-100">
                                        <p className="text-2xl mb-1">⚡</p>
                                        <p className="font-bold text-xs">20 MIN DELIVERY</p>
                                    </div>
                                    <div className="p-4 bg-white rounded-2xl border border-orange-100">
                                        <p className="text-2xl mb-1">💰</p>
                                        <p className="font-bold text-xs">BEST PRICES</p>
                                    </div>
                                    <div className="p-4 bg-white rounded-2xl border border-orange-100">
                                        <p className="text-2xl mb-1">🧼</p>
                                        <p className="font-bold text-xs">HYGIENIC PREP</p>
                                    </div>
                                    <div className="p-4 bg-white rounded-2xl border border-orange-100">
                                        <p className="text-2xl mb-1">📍</p>
                                        <p className="font-bold text-xs">ALL OVER INDIA</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'menu' && (
                            <div>
                                <div className="flex gap-2 overflow-x-auto pb-6 no-scrollbar mb-8">
                                    {['all', 'Coffee', 'Tea', 'Food', 'Dessert'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-8 py-3 rounded-full whitespace-nowrap font-bold text-sm ${selectedCategory === cat ? 'bg-orange-600 text-white shadow-lg' : 'bg-white border border-orange-100 text-orange-900'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {filteredMenu.map(item => (
                                        <div key={item.id} className="bg-white rounded-[2.5rem] p-6 border border-orange-50 shadow-sm hover:shadow-xl transition-all group">
                                            <div className="text-5xl mb-4 group-hover:scale-110 transition-transform inline-block">{item.image}</div>
                                            <h3 className="font-extrabold text-2xl text-gray-900 mb-1">{item.name}</h3>
                                            <p className="text-gray-500 text-sm mb-6 leading-relaxed">{item.description}</p>
                                            <div className="flex items-center justify-between">
                                                <span className="text-3xl font-black text-orange-600">₹{item.price}</span>
                                                <button 
                                                    onClick={() => addToCart(item)}
                                                    className="bg-orange-50 text-orange-600 px-6 py-3 rounded-2xl font-black hover:bg-orange-600 hover:text-white transition-all shadow-sm"
                                                >
                                                    + Add
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentTab === 'cart' && (
                            <div className="max-w-xl mx-auto">
                                <div className="bg-white p-8 rounded-[3rem] shadow-2xl border border-orange-50">
                                    <h2 className="text-3xl font-black mb-8 text-gray-900">Your Tray</h2>
                                    
                                    <div className="flex gap-4 mb-8">
                                        <button onClick={() => setOrderType('delivery')} className={`flex-1 p-4 rounded-2xl font-bold border-2 transition-all ${orderType === 'delivery' ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-gray-100 text-gray-400'}`}>🚚 Delivery</button>
                                        <button onClick={() => setOrderType('pickup')} className={`flex-1 p-4 rounded-2xl font-bold border-2 transition-all ${orderType === 'pickup' ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-gray-100 text-gray-400'}`}>🏪 Pickup</button>
                                    </div>

                                    {cart.length === 0 ? (
                                        <div className="text-center py-12">
                                            <p className="text-gray-400 font-bold mb-4">Your tray is empty!</p>
                                            <button onClick={() => setCurrentTab('menu')} className="text-orange-600 font-black underline">Go back to menu</button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="space-y-6 mb-8">
                                                {cart.map(item => (
                                                    <div key={item.id} className="flex justify-between items-center">
                                                        <div className="flex items-center gap-4">
                                                            <span className="text-2xl">{item.image}</span>
                                                            <div>
                                                                <p className="font-extrabold text-gray-900">{item.name}</p>
                                                                <p className="text-xs font-bold text-gray-400">{item.quantity} unit(s) • ₹{item.price}</p>
                                                            </div>
                                                        </div>
                                                        <span className="font-black text-gray-900">₹{item.price * item.quantity}</span>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="mb-8 pt-6 border-t border-dashed border-gray-200">
                                                <input 
                                                    type="text" 
                                                    placeholder="Enter Your Name" 
                                                    className="w-full p-4 rounded-2xl bg-orange-50/50 border-none outline-none focus:ring-2 focus:ring-orange-200 font-bold placeholder:text-orange-300"
                                                    value={customerName}
                                                    onChange={(e) => setCustomerName(e.target.value)}
                                                />
                                            </div>

                                            <div className="flex justify-between items-center mb-8">
                                                <span className="text-gray-500 font-bold uppercase tracking-widest text-xs">Grand Total</span>
                                                <span className="text-4xl font-black text-orange-600">₹{getTotal()}</span>
                                            </div>

                                            <button 
                                                onClick={placeWhatsAppOrder}
                                                className="w-full bg-green-600 text-white py-5 rounded-[2rem] font-black text-xl shadow-xl hover:shadow-green-200 hover:scale-[1.02] transition-all flex items-center justify-center gap-3"
                                            >
                                                <i className="fab fa-whatsapp text-2xl"></i> Order via WhatsApp
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-orange-950 text-orange-100 py-16 mt-20">
                        <div className="max-w-6xl mx-auto px-4 text-center">
                            <h2 className="text-3xl font-black text-white mb-4">CafeHub India</h2>
                            <p className="opacity-70 mb-8 max-w-sm mx-auto">Freshly made snacks and artisan coffee delivered faster than you can say 'Chai'.</p>
                            
                            <div className="space-y-4 mb-10">
                                <p className="text-xs font-black tracking-widest uppercase opacity-40">Contact Support</p>
                                <a href="tel:+918805984678" className="text-2xl font-black text-white block hover:text-orange-400 transition-colors">+91 88059 84678</a>
                                <p className="text-sm">Available: 8:00 AM - 11:00 PM IST</p>
                            </div>

                            <div className="flex justify-center gap-6 mb-10">
                                <a href="#" className="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-xl hover:bg-orange-600 transition-all"><i className="fab fa-instagram"></i></a>
                                <a href="https://wa.me/918805984678" className="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-xl hover:bg-green-600 transition-all"><i className="fab fa-whatsapp"></i></a>
                            </div>

                            <div className="pt-8 border-t border-white/10 text-xs opacity-40 font-bold">
                                © 2026 CAFEHUB INDIA. ALL RIGHTS RESERVED.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
